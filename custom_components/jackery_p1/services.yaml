read_wifi:
  name: Read Wi-Fi details
  description: Send the known read-only BLE Wi-Fi information command. Potential credential fields are redacted.
  fields:
    entry_id:
      name: Config entry ID
      description: ID of the configured Jackery P1 integration entry
      required: true
      selector:
        text:
read_timezone:
  name: Read time zone
  description: Send the known read-only BLE time-zone command.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
read_device_info:
  name: Read device information
  description: Send the known read-only BLE device telemetry command.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
send_command:
  name: Send read-only BLE command
  description: Execute a verified read-only command and return decrypted JSON. Unknown and write commands are rejected.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    command:
      name: BLE command code
      required: true
      example: 106
      selector:
        select:
          options:
            - label: Read Wi-Fi (1)
              value: "1"
            - label: Read time zone (22)
              value: "22"
            - label: Read device information (106)
              value: "106"
