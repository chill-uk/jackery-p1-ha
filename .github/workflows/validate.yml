name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python and metadata tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pytest cryptography
      - name: Compile integration
        run: python -m compileall -q custom_components tests
      - name: Validate integration metadata
        run: |
          python -m json.tool custom_components/jackery_p1/manifest.json > /dev/null
          python -m json.tool custom_components/jackery_p1/strings.json > /dev/null
          python -m json.tool hacs.json > /dev/null
      - name: Run BLE protocol tests
        run: python -m pytest -q tests

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
